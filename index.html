<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keylogger Detection System - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
        }
        
        .scan-section {
            text-align: center;
            margin: 40px 0;
        }
        
        .scan-button {
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin: 10px;
        }
        
        .scan-button.primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }
        
        .scan-button.demo {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            box-shadow: 0 5px 15px rgba(238, 90, 36, 0.4);
        }
        
        .scan-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.5);
        }
        
        .scan-button:active {
            transform: translateY(0);
        }
        
        .results-section {
            margin-top: 40px;
            display: none;
        }
        
        .results-section.active {
            display: block;
        }
        
        .alert-box {
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .alert-box.critical {
            background: #ff4757;
            color: white;
        }
        
        .alert-box.safe {
            background: #2ecc71;
            color: white;
        }
        
        .process-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .process-table th {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: left;
        }
        
        .process-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
        }
        
        .process-table tr:hover {
            background: #f5f5f5;
        }
        
        .badge {
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            color: white;
            display: inline-block;
        }
        
        .badge.critical {
            background: #ff4757;
        }
        
        .badge.high {
            background: #ffa502;
        }
        
        .badge.medium {
            background: #ffd93d;
            color: #333;
        }
        
        .badge.low {
            background: #2ecc71;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ Keylogger Detection System</h1>
            <p>Real-Time Threat Detection with VirusTotal Validation</p>
        </div>
        
        <div class="content">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Scans</h3>
                    <div class="value" id="totalScans">0</div>
                </div>
                <div class="stat-card">
                    <h3>Threats Detected</h3>
                    <div class="value" id="threatsDetected">0</div>
                </div>
                <div class="stat-card">
                    <h3>System Status</h3>
                    <div class="value" style="font-size: 1.8em;" id="systemStatus">🟢 Safe</div>
                </div>
            </div>
            
            <div class="scan-section">
                <button class="scan-button primary" onclick="startScan()">
                    🔍 Start System Scan
                </button>
                
                <button class="scan-button demo" onclick="showDemoAlert()">
                    🚨 Simulate Keylogger Detection
                </button>
            </div>
            
            <div class="loading" id="loadingSection">
                <div class="spinner"></div>
                <h3>Scanning system for threats...</h3>
                <p>Please wait while we analyze running processes</p>
            </div>
            
            <div class="results-section" id="resultsSection">
                <h2>Scan Results</h2>
                <div id="resultsContent"></div>
            </div>
        </div>
    </div>
    
    <script>
        let scanCount = 0;
        let totalThreats = 0;
        
        async function startScan() {
            // Show loading
            document.getElementById('loadingSection').classList.add('active');
            document.getElementById('resultsSection').classList.remove('active');
            
            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                // Hide loading
                document.getElementById('loadingSection').classList.remove('active');
                
                // Update stats
                scanCount++;
                totalThreats += data.suspicious_count;
                document.getElementById('totalScans').textContent = scanCount;
                document.getElementById('threatsDetected').textContent = totalThreats;
                
                // Update system status
                if (data.suspicious_count > 0) {
                    document.getElementById('systemStatus').innerHTML = '🔴 Threats Found';
                } else {
                    document.getElementById('systemStatus').innerHTML = '🟢 Safe';
                }
                
                // Display results
                displayResults(data);
                
            } catch (error) {
                console.error('Error:', error);
                alert('Scan failed. Please try again.');
                document.getElementById('loadingSection').classList.remove('active');
            }
        }
        
        function showDemoAlert() {
            alert('🚨 CRITICAL ALERT!\n\nSimulated Detection:\nKeylogger.exe (PID: 9999)\nRisk Level: CRITICAL\n\nThis demonstrates what would happen if a real keylogger was detected on the system.\n\nFeatures detected:\n- Keyboard hook monitoring\n- Hidden process\n- Suspicious network activity\n- Known malware signature');
            
            // Add a simulated entry to the results
            const demoData = {
                suspicious_count: 1,
                total_processes: 100,
                results: [{
                    name: 'keylogger_demo.exe',
                    pid: 9999,
                    risk_level: 'CRITICAL',
                    risk_score: 95,
                    detection_reasons: [
                        'Known keylogger signature',
                        'Keyboard hook detected',
                        'Sending data to suspicious IP',
                        'Hidden from task list',
                        'Potential keyboard monitoring detected'
                    ],
                    virus_total_result: {
                        checked: true,
                        is_malicious: true,
                        detection_count: 45,
                        total_engines: 50,
                        message: '45/50 engines detected as malicious'
                    }
                }]
            };
            
            // Update stats for demo
            scanCount++;
            totalThreats += 1;
            document.getElementById('totalScans').textContent = scanCount;
            document.getElementById('threatsDetected').textContent = totalThreats;
            document.getElementById('systemStatus').innerHTML = '🔴 CRITICAL THREAT!';
            
            displayResults(demoData);
        }
        
        function displayResults(data) {
            const resultsSection = document.getElementById('resultsSection');
            const resultsContent = document.getElementById('resultsContent');
            
            if (data.suspicious_count === 0) {
                resultsContent.innerHTML = `
                    <div class="alert-box safe">
                        <h3>✅ No Threats Detected</h3>
                        <p>Your system is clean. ${data.total_processes} processes scanned.</p>
                    </div>
                `;
            } else {
                let html = `
                    <div class="alert-box critical">
                        <h3>⚠️ ${data.suspicious_count} Suspicious Process(es) Detected!</h3>
                        <p>Immediate action recommended. Review the processes below.</p>
                    </div>
                    
                    <table class="process-table">
                        <thead>
                            <tr>
                                <th>Process Name</th>
                                <th>PID</th>
                                <th>Risk Level</th>
                                <th>Detection Reasons</th>
                                <th>VirusTotal</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                data.results.forEach(proc => {
                    html += `
                        <tr>
                            <td><strong>${proc.name}</strong></td>
                            <td>${proc.pid}</td>
                            <td><span class="badge ${proc.risk_level.toLowerCase()}">${proc.risk_level}</span></td>
                            <td>${proc.detection_reasons.join(', ')}</td>
                            <td>${proc.virus_total_result ? proc.virus_total_result.message : 'Not checked'}</td>
                        </tr>
                    `;
                });
                
                html += '</tbody></table>';
                resultsContent.innerHTML = html;
            }
            
            resultsSection.classList.add('active');
        }
    </script>
</body>
</html>
